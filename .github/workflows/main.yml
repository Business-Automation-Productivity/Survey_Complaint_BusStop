name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '30 * * * *'  # Runs every hour at the 30th minute
  workflow_dispatch:

jobs:
  ping_streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Human-Like Session
        run: |
          python - <<EOF
          import time
          import random
          from playwright.sync_api import sync_playwright

          def run_session():
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-infobars",
                          "--window-size=1920,1080"
                      ]
                  )
                  
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={'width': 1920, 'height': 1080},
                      device_scale_factor=1,
                      is_mobile=False,
                      has_touch=False
                  )
                  
                  # Native script override to hide automation flags without extra package dependencies
                  context.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {
                          get: () => undefined
                      });
                  """)
                  
                  page = context.new_page()
                  
                  print("🚀 Navigating to Streamlit app (Waking up server)...")
                  
                  try:
                      page.goto("https://surveycomplaintbusstop-dghuh3zeaibrappvjjrxxlp.streamlit.app/",
                                 wait_until="load",
                                 timeout=120000)
                                            
                      print("⏳ Waiting for app content to render...")
                      page.wait_for_selector("div", timeout=60000)
                                            
                      time.sleep(random.uniform(4, 7))
                                            
                      print("🖱️ Simulating human scroll activity...")
                      page.mouse.wheel(0, random.randint(300, 600))
                      time.sleep(random.uniform(2, 4))
                      page.mouse.wheel(0, random.randint(-200, -100))
                      
                      page.mouse.move(random.randint(100, 500), random.randint(100, 500))
                      
                      print(f"✅ Success! Current Title: {page.title()}")
                                            
                      time.sleep(25)
                      
                  except Exception as e:
                      print(f"❌ Error: {str(e)}")
                      print("DEBUG: Current Page Title was:", page.title())
                  finally:
                      browser.close()

          if __name__ == "__main__":
              run_session()
          EOF
