name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '30 * * * *'  # Runs every hour at the 30th minute
  workflow_dispatch:

jobs:
  ping_streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Human-Like Session & Capture Screenshots
        run: |
          python - <<EOF
          import os
          import time
          import random
          from playwright.sync_api import sync_playwright

          def run_session():
              urls = [
                  "https://surveycomplaintbusstop-dghuh3zeaibrappvjjrxxlp.streamlit.app/"
              ]
              
              workspace_dir = os.getcwd()
              print(f"Workspace directory: {workspace_dir}")

              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-infobars",
                          "--window-size=1920,1080"
                      ]
                  )
                  
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={'width': 1920, 'height': 1080},
                      device_scale_factor=1,
                      is_mobile=False,
                      has_touch=False
                  )

                  # Native script override to hide automation flags
                  context.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {
                          get: () => undefined
                      });
                  """)

                  for index, target_url in enumerate(urls, start=1):
                      print(f"\n--- Processing Link {index}: {target_url} ---")
                      page = context.new_page()
                      screenshot_filename = f"streamlit_screenshot_{index}.png"
                      screenshot_path = os.path.join(workspace_dir, screenshot_filename)
                      
                      try:
                          print("🚀 Navigating to Streamlit app (Waking up server)...")
                          page.goto(target_url, wait_until="load", timeout=120000)
                          
                          print("⏳ Waiting for app content to render...")
                          page.wait_for_selector("div", timeout=60000)
                          
                          time.sleep(random.uniform(4, 7))
                          
                          print("🖱️ Simulating human scroll and mouse activity...")
                          page.mouse.wheel(0, random.randint(300, 600))
                          time.sleep(random.uniform(2, 4))
                          page.mouse.wheel(0, random.randint(-200, -100))
                          
                          page.mouse.move(random.randint(100, 500), random.randint(100, 500))
                          
                          print(f"✅ Success! Current Title: {page.title()}")
                          
                          dwell_time = random.uniform(25.0, 45.0)
                          print(f"Holding active session for {dwell_time:.2f} seconds...")
                          time.sleep(dwell_time)

                          page.screenshot(path=screenshot_path, full_page=False)
                          print(f"Screenshot saved to {screenshot_path}")

                      except Exception as e:
                          print(f"❌ Error on link {index}: {str(e)}")
                          try:
                              print("DEBUG: Current Page Title was:", page.title())
                          except:
                              pass
                          try:
                              page.screenshot(path=screenshot_path, full_page=False)
                              print(f"Fallback screenshot saved to {screenshot_path}")
                          except Exception as inner_e:
                              print(f"Could not save fallback screenshot: {inner_e}")
                      finally:
                          page.close()

                  browser.close()

          if __name__ == "__main__":
              run_session()
          EOF

      - name: Upload Screenshots as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-screenshots
          path: streamlit_screenshot_*.png
          retention-days: 3
          if-no-files-found: ignore
